name = "sha01"

# Build output goes to the disposable tree at Projects/_buildoutput/,
# which is safe to delete wholesale; Lake recreates it on the next build.
# Static path, not $VAR: lakefile.toml does not interpolate the environment.
buildDir = "../../../_buildoutput/256-shavar/broken/lean"
version = "0.1.0"
defaultTargets = ["Sha01", "sha01lean"]

[[lean_lib]]
name = "Sha01"
globs = ["Sha01", "Sha01.+"]

# A driver so broken/tests/run.sh can check the Lean implementation against the
# C one. The two were written from FIPS 180 independently; agreeing is evidence.
[[lean_exe]]
name = "sha01lean"
root = "Main"
