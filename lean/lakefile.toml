name = "shavar"

# Build output goes to the disposable tree at Projects/buildoutput/,
# which is safe to delete wholesale; Lake recreates it on the next build.
# Static path, not $VAR: lakefile.toml does not interpolate the environment.
buildDir = "../../buildoutput/256-shavar/lean"
version = "0.1.0"
defaultTargets = ["Shavar", "shavar", "powdriver", "roundsdriver", "sha256sum"]

# `globs` makes every module under Shavar/ part of the library, including
# Shavar/Tests.lean (build-time known-answer checks) and Shavar/Audit.lean
# (the `#print axioms` report). Both therefore run on every `lake build`.
[[lean_lib]]
name = "Shavar"
globs = ["Shavar", "Shavar.+"]

[[lean_exe]]
name = "shavar"
root = "Main"

# The proof-of-work comparison of SPEC.md §10 has no subcommand — it is
# library-only, so it is invisible to the CLI contract that `shavar` implements.
# `powdriver` is the marshalling shim tests/pow.sh runs to reach it, and it is a
# default target so that a plain `lake build` produces everything the test
# suite expects to find.
[[lean_exe]]
name = "powdriver"
root = "PowDriver"

# The library-level round-count contract of SPEC.md 6.1 is likewise not
# reachable through the CLI -- the CLI rejects an out-of-range count before the
# library sees it -- so tests/rounds.sh needs its own entry point.
[[lean_exe]]
name = "roundsdriver"
root = "RoundsDriver"

# A shasum-style convenience for hashing local files. Lean-only, outside the
# shared CLI contract of spec/CLI.md — see the header of Sha256Sum.lean.
[[lean_exe]]
name = "sha256sum"
root = "Sha256Sum"
